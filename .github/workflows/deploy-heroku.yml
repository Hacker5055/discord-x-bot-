name: Deploy BLACK X to Heroku

on:
  workflow_dispatch:
    inputs:
      expected_app:
        description: 'Confirm the configured Heroku app name (optional)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: black-x-heroku-production
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: black-x-production
    env:
      HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
      EXPECTED_HEROKU_APP: ${{ inputs.expected_app }}
    steps:
      - name: Validate Heroku app name
        shell: bash
        run: |
          if ! [[ "$HEROKU_APP_NAME" =~ ^[a-z][a-z0-9-]{1,28}[a-z0-9]$ ]]; then
            echo '::error::Set a valid HEROKU_APP_NAME (app name, not URL) in the black-x-production environment.'
            exit 1
          fi
          if [[ -n "$EXPECTED_HEROKU_APP" && "$HEROKU_APP_NAME" != "$EXPECTED_HEROKU_APP" ]]; then
            echo '::error::The configured Heroku app does not match expected_app. Nothing was deployed.'
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build the web image (Linux AMD64)
        shell: bash
        run: |
          set -euo pipefail
          config=$(bash .github/scripts/build-heroku-web.sh "registry.heroku.com/$HEROKU_APP_NAME/web")
          printf 'BLACK_X_WEB_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Push and release to Heroku
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$HEROKU_API_KEY" || "$HEROKU_API_KEY" == *[$'\r\n']* ]]; then
            echo '::error::Set the HEROKU_API_KEY secret for the deploy account in black-x-production.'
            exit 1
          fi

          heroku_api() {
            printf 'Authorization: Bearer %s\n' "$HEROKU_API_KEY" | \
              curl --disable --silent --show-error --proto '=https' --max-time 90 --header @- "$@"
          }

          if ! heroku_api --fail --header 'Accept: application/vnd.heroku+json; version=3' \
            "https://api.heroku.com/apps/$HEROKU_APP_NAME" | \
            jq -e '.stack.name == "container" or .build_stack.name == "container"' >/dev/null; then
            echo '::error::Could not verify the app. Check the deploy account access, app name, and container stack (Cedar).'
            exit 1
          fi

          if ! [[ "${BLACK_X_WEB_CONFIG:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::No verified image configuration digest from the build. Nothing was uploaded.'
            exit 1
          fi

          export DOCKER_CONFIG="$(mktemp -d "${RUNNER_TEMP}/black-x-docker.XXXXXX")"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          image="registry.heroku.com/$HEROKU_APP_NAME/web"
          # Force a single manifest even when the runner's Docker store uses an image index.
          docker push --platform linux/amd64 "$image"

          # Like Heroku's CLI, use the registry's config.digest. Docker inspect .Id can be the
          # manifest or index digest with a containerd image store, which formation cannot release.
          manifest="$DOCKER_CONFIG/web-manifest.json"
          registry_auth() {
            printf 'Authorization: Basic '
            printf ':%s' "$HEROKU_API_KEY" | base64 -w 0
            printf '\n'
          }
          if ! registry_auth | curl --disable --silent --show-error --fail --proto '=https' --max-time 60 --header @- \
            --header 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' \
            --output "$manifest" "https://registry.heroku.com/v2/$HEROKU_APP_NAME/web/manifests/latest"; then
            echo '::error::Could not verify the uploaded web manifest. No release was requested.'
            exit 1
          fi
          if ! image_id=$(jq -er 'select(.schemaVersion == 2) | .config.digest | strings | select(test("^sha256:[0-9a-f]{64}$"))' "$manifest" 2>/dev/null) \
            || [[ "$image_id" != "$BLACK_X_WEB_CONFIG" ]]; then
            echo '::error::The registry web config does not match the image built in this run. No release was requested.'
            exit 1
          fi
          echo "Verified uploaded web image configuration: $image_id"
          payload=$(jq -cn --arg image "$image_id" '{updates: [{type: "web", docker_image: $image}]}')
          release_response="$DOCKER_CONFIG/release-response.json"
          if ! status=$(heroku_api --request PATCH \
            --header 'Accept: application/vnd.heroku+json; version=3.docker-releases' \
            --header 'Content-Type: application/json' --data-binary "$payload" \
            --output "$release_response" --write-out '%{http_code}' \
            "https://api.heroku.com/apps/$HEROKU_APP_NAME/formation"); then
            echo '::error::No complete response from Heroku. Check app Activity before retrying the release.'
            exit 1
          fi
          if ! [[ "$status" =~ ^2[0-9]{2}$ ]]; then
            [[ "$status" =~ ^[0-9]{3}$ ]] || status=000
            # Do not echo a response body or arbitrary upstream strings into the Actions log.
            error_id=$(jq -er '.id | select(. == "not_found" or . == "unauthorized" or . == "forbidden" or
              . == "invalid_params" or . == "unprocessable_entity" or . == "rate_limit")' \
              "$release_response" 2>/dev/null) || error_id=unknown
            resource=$(jq -er '.resource | select(. == "docker_image" or . == "formation" or . == "app")' \
              "$release_response" 2>/dev/null) || resource=unknown
            printf '::error::Heroku rejected the web release (HTTP %s, %s, resource: %s). Check app Activity and deploy access.\n' \
              "$status" "$error_id" "$resource"
            exit 1
          fi
          echo "Heroku accepted the web release for $GITHUB_SHA. Check dyno logs for gateway_ready."
