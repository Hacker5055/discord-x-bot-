name: Deploy BLACK X to Cloud Run

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: black-x-cloud-run-production
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: black-x-production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
      BX_OWNER_DISCORD_ID: ${{ vars.BX_OWNER_DISCORD_ID }}
    steps:
      - name: Validate deployment settings
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for key in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT DISCORD_GUILD_ID BX_OWNER_DISCORD_ID; do
            if [[ -z "${!key}" ]]; then
              printf '::error::Set %s in the black-x-production GitHub environment.\n' "$key"
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then exit 1; fi
          if ! [[ "$DISCORD_GUILD_ID" =~ ^[1-9][0-9]{16,19}$ && "$BX_OWNER_DISCORD_ID" =~ ^[1-9][0-9]{16,19}$ ]]; then
            echo '::error::DISCORD_GUILD_ID and BX_OWNER_DISCORD_ID must be Discord snowflakes.'
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud via GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Deploy a single always-on instance
        shell: bash
        run: |
          gcloud run deploy black-x-bot --quiet --source=. \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT" --port=8080 \
            --min-instances=1 --max-instances=1 --no-cpu-throttling --no-allow-unauthenticated \
            --set-env-vars="DISCORD_GUILD_ID=$DISCORD_GUILD_ID,BX_OWNER_DISCORD_ID=$BX_OWNER_DISCORD_ID" \
            --set-secrets='DISCORD_BOT_TOKEN=discord-bot-token:latest,BOT_API_SECRET=black-x-api-secret:latest'
