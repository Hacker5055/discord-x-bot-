name: CI

on: [push, pull_request, workflow_call]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate the Heroku web image on the hosted runner
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          config=$(bash .github/scripts/build-heroku-web.sh black-x-ci/web)
          if ! [[ "$config" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::The built web image did not yield a valid config digest.'
            exit 1
          fi
